msg-level=cache=v
keep-open
autofit-larger=80%x80%
sub-auto=fuzzy
screenshot-directory=~/Pictures/mpvshots/
vo=gpu-next
gpu-context=waylandvk,wayland
gpu-api=vulkan,auto
slang=Chinese(Simplifed),chi,zh-cn,zh
#screenshot-format=avif
screenshot-avif-encoder=librav1e
screenshot-avif-pixfmt=yuv420p
screenshot-avif-opts=speed=9

hwdec=vulkan,vaapi

#target-colorspace-hint=auto

#video-sync=display-resample
#interpolation  # requires video-sync=display-*
#tscale=oversample

deband
blend-subtitles=video

#profile=high-quality

watch-later-options=start,vid,aid,sid

# https://github.com/Samillion/ModernZ
#osc=no

[dolbyvision]
# src: https://nyaa.si/view/1578114#com-7
profile-desc=适合在 SDR 屏幕上观看 Dolby Vision 杜比视界的色彩配置
hwdec=no
tone-mapping=bt.2446a

# vim: ft=mplayerconf
