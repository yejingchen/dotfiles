<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- https://sh.alynx.one/posts/Fontconfig-NotoColorEmoji-Antialias/ -->
<fontconfig>
	<!-- 针对所有字体的默认设置，力求显示效果最好。 -->
	<match target="scan">
		<!-- 禁用内嵌点阵。 -->
		<edit name="embeddedbitmap" mode="assign">
			<bool>false</bool>
		</edit>
		<!-- 禁用合成粗体。 -->
		<edit name="embolden" mode="assign">
			<bool>false</bool>
		</edit>
		<!-- 设置显示器为 RGB 排列。 -->
		<edit name="rgba" mode="assign">
			<const>none</const>
		</edit>
		<edit name="hinting" mode="assign">
			<bool>false</bool>
		</edit>
		<edit name="autohint" mode="assign">
			<bool>false</bool>
		</edit>
		<edit name="hintstyle" mode="assign">
			<const>hintnone</const>
		</edit>
		<!-- 开启抗锯齿。 -->
		<edit name="antialias" mode="assign">
			<bool>true</bool>
		</edit>
	</match>

	<!-- Twemoji 要打开内嵌点阵。当然另一个简单方案是换成 Twemoji，不过它不能关这个。 -->
	<match target="scan">
		<test name="family" qual="any">
			<string>Twemoji</string>
		</test>
		<edit name="embeddedbitmap" mode="assign" binding="strong">
			<bool>true</bool>
		</edit>
	</match>

	<!-- Noto Color Emoji 不支持开启抗锯齿和微调，所以在全局开启之后还得给它关掉。 -->
	<match target="scan">
		<test name="family" qual="any">
			<string>Noto Color Emoji</string>
		</test>
		<edit name="scalable" mode="assign" binding="strong">
			<bool>true</bool>
		</edit>
		<edit name="embeddedbitmap" mode="assign" binding="strong">
			<bool>true</bool>
		</edit>
		<edit name="hinting" mode="assign" binding="strong">
			<bool>false</bool>
		</edit>
		<edit name="antialias" mode="assign" binding="strong">
			<bool>false</bool>
		</edit>
	</match>

	<!-- 我真不理解一个等宽字体要连字功能干嘛？故意变得不等宽？ -->
	<match target="scan">
		<test name="family" qual="any">
			<string>Monaco</string>
		</test>
		<edit name="fontfeatures" mode="append" binding="strong">
			<string>liga off</string>
			<string>dlig off</string>
		</edit>
	</match>
</fontconfig>
